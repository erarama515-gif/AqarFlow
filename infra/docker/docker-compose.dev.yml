version: "3.9"

# -----------------------------------------------------------------------------
# AqarFlow — Development Infrastructure
# Run: docker compose -f infra/docker/docker-compose.dev.yml up -d
# -----------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: aqarflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aqarflow
      POSTGRES_PASSWORD: aqarflow
      POSTGRES_DB: aqarflow
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF-8"
    ports:
      - "25432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqarflow -d aqarflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aqarflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aqarflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aqarflow
      MINIO_ROOT_PASSWORD: aqarflow-secret
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bootstraps a default MinIO bucket so the API can upload media immediately
  minio-setup:
    image: minio/mc:latest
    container_name: aqarflow-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 aqarflow aqarflow-secret;
      mc mb --ignore-existing local/aqarflow-media;
      mc anonymous set download local/aqarflow-media;
      exit 0;
      "

  mailpit:
    # Local SMTP catcher (replaces Mailtrap, totally free, no signup)
    image: axllent/mailpit:latest
    container_name: aqarflow-mailpit
    restart: unless-stopped
    ports:
      - "11025:1025"   # SMTP
      - "18025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 5000

volumes:
  pgdata:
  redisdata:
  miniodata:
