name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — typecheck, build, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: aqarflow
          POSTGRES_PASSWORD: aqarflow
          POSTGRES_DB: aqarflow
        options: >-
          --health-cmd "pg_isready -U aqarflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://aqarflow:aqarflow@localhost:5432/aqarflow?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: this-is-a-test-jwt-access-secret-32chars
      JWT_REFRESH_SECRET: this-is-a-test-jwt-refresh-secret-32cs
      PASSWORD_PEPPER: this-is-a-test-pepper-min-32-chars-ok
      S3_ACCESS_KEY: aqarflow
      S3_SECRET_KEY: aqarflow-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 8.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @aqarflow/api prisma generate
      - run: pnpm --filter @aqarflow/api prisma migrate deploy
      - run: pnpm --filter @aqarflow/api typecheck
      - run: pnpm --filter @aqarflow/api build
      - run: pnpm --filter @aqarflow/api test --passWithNoTests

  web:
    name: Web — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 8.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @aqarflow/web typecheck
      - env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: pnpm --filter @aqarflow/web build
